name: تحديث يومي لملف المنتجات

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: تثبيت مكتبة Firebase Admin
        run: npm install firebase-admin

      - name: جلب المنتجات وتوليد JSON
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
          const admin = require("firebase-admin");
          const fs = require("fs");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const db = admin.firestore();

          async function exportProducts() {
            try {
              const snapshot = await db.collection("products").get();
              const products = [];
              snapshot.forEach(doc => {
                products.push({ id: doc.id, ...doc.data() });
              });

              fs.writeFileSync("products.json", JSON.stringify(products, null, 2));
              console.log("Done! Created products.json with " + products.length + " items.");
            } catch (error) {
              console.error("Error:", error);
              process.exit(1);
            }
          }

          exportProducts();
          '

      - name: رفع الملف الجديد إلى المستودع
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Automated update of products.json" || exit 0
          git push
