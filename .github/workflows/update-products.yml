name: تصدير المنتجات يدوياً (احتياطي)

on:
  workflow_dispatch:   # تشغيل يدوي فقط من واجهة GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: تثبيت Firebase Admin
        run: npm install firebase-admin

      - name: جلب المنتجات وتوليد products.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
          const admin = require("firebase-admin");
          const fs = require("fs");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();

          async function exportProducts() {
            const snapshot = await db.collection("products").get();
            const products = [];
            snapshot.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
            fs.writeFileSync("products.json", JSON.stringify(products, null, 2));
            console.log("✅ products.json تم إنشاؤه بـ " + products.length + " منتج");
          }

          exportProducts().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: رفع products.json للمستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "تحديث يدوي للمنتجات من Firestore" || exit 0
          git push
